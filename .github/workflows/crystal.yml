name: Crystal

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      LAVINMQ_AMQP_UNIXSOCKET: /tmp/lavinmq/amqp.sock
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.22"
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
      - name: Start LavinMQ
        run: |
          rm -rf /tmp/lavinmq
          mkdir -p /tmp/lavinmq
          chmod 777 /tmp/lavinmq
          cat > "$RUNNER_TEMP/lavinmq.ini" <<'EOF'
          [amqp]
          unix_path = /tmp/lavinmq/amqp.sock
          EOF

          docker rm --force lavinmq >/dev/null 2>&1 || true
          docker run --detach --name lavinmq \
            --mount type=bind,source=/tmp/lavinmq,target=/tmp/lavinmq \
            --mount "type=bind,source=$RUNNER_TEMP/lavinmq.ini,target=/etc/lavinmq/lavinmq.ini,readonly" \
            cloudamqp/lavinmq:2.10.2

          for attempt in $(seq 1 60); do
            if [ -S "$LAVINMQ_AMQP_UNIXSOCKET" ]; then
              sudo chmod 777 "$LAVINMQ_AMQP_UNIXSOCKET"
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' lavinmq 2>/dev/null || true)" != "true" ]; then
              docker logs lavinmq
              exit 1
            fi
            sleep 1
          done

          if [ ! -S "$LAVINMQ_AMQP_UNIXSOCKET" ]; then
            docker logs lavinmq
            echo "LavinMQ AMQP Unix socket did not become ready." >&2
            exit 1
          fi
      - name: Install shards
        run: shards install
      - name: Build CLI targets
        run: shards build
      - name: Run Crystal specs
        run: crystal spec
      - name: Show LavinMQ logs on failure
        if: failure()
        run: docker logs lavinmq
      - name: Stop LavinMQ
        if: always()
        run: docker rm --force lavinmq >/dev/null 2>&1 || true
