name: Crystal

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LAVINMQ_AMQP_UNIXSOCKET: /tmp/lavinmq/amqp.sock
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.22"
      - name: Generate Crystal sources
        run: bundle exec bgem
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
      - name: Start LavinMQ
        run: |
          rm -rf /tmp/lavinmq
          mkdir -p /tmp/lavinmq
          chmod 777 /tmp/lavinmq
          cat > "$RUNNER_TEMP/lavinmq.ini" <<'EOF'
          [amqp]
          unix_path = /tmp/lavinmq/amqp.sock
          EOF

          docker rm --force lavinmq >/dev/null 2>&1 || true
          docker run --detach --name lavinmq \
            --mount type=bind,source=/tmp/lavinmq,target=/tmp/lavinmq \
            --mount "type=bind,source=$RUNNER_TEMP/lavinmq.ini,target=/etc/lavinmq/lavinmq.ini,readonly" \
            cloudamqp/lavinmq:2.10.2

          for attempt in $(seq 1 60); do
            if [ -S "$LAVINMQ_AMQP_UNIXSOCKET" ]; then
              sudo chmod 777 "$LAVINMQ_AMQP_UNIXSOCKET"
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' lavinmq 2>/dev/null || true)" != "true" ]; then
              docker logs lavinmq
              exit 1
            fi
            sleep 1
          done

          if [ ! -S "$LAVINMQ_AMQP_UNIXSOCKET" ]; then
            docker logs lavinmq
            echo "LavinMQ AMQP Unix socket did not become ready." >&2
            exit 1
          fi
      - name: Install shards
        run: shards install
      - name: Build CLI targets
        run: shards build
      - name: Run Crystal specs
        run: crystal spec
      - name: Run tmux.repl smoke test
        env:
          TMUX_REPL_TEST_DELAY: "0"
          TERM: xterm-256color
        shell: bash
        run: |
          set -euo pipefail

          result_file="$RUNNER_TEMP/tmux-repl-smoke-test.exit"
          terminal_log="$RUNNER_TEMP/tmux-repl-smoke-test.terminal"
          rm -f "$result_file" "$terminal_log"

          tmux new-session -d -s tmux-repl-ci
          script -q -e -c "tmux attach-session -t tmux-repl-ci" "$terminal_log" &
          client_pid=$!
          trap 'tmux kill-server >/dev/null 2>&1 || true; wait "$client_pid" 2>/dev/null || true' EXIT

          attached=0
          for attempt in $(seq 1 50); do
            if tmux list-clients -F '#{client_session}' | grep -Fxq tmux-repl-ci; then
              attached=1
              break
            fi
            sleep 0.2
          done
          if [ "$attached" -ne 1 ]; then
            cat "$terminal_log" || true
            echo "Could not attach a tmux client for the smoke test." >&2
            exit 1
          fi

          command="cd '$GITHUB_WORKSPACE' && ./bin/tmux.repl.test; smoke_status=\$?; ./bin/tmux.repl.custom_repl.test; custom_status=\$?; printf '%s %s\n' \"\$smoke_status\" \"\$custom_status\" > '$result_file'"
          tmux send-keys -t tmux-repl-ci:0.0 "$command" Enter

          completed=0
          for attempt in $(seq 1 240); do
            if [ -f "$result_file" ]; then
              completed=1
              break
            fi
            sleep 1
          done

          if [ "$completed" -ne 1 ]; then
            tmux capture-pane -p -t tmux-repl-ci:0.0 || true
            cat "$terminal_log" || true
            echo "tmux.repl.test did not finish within four minutes." >&2
            exit 1
          fi

          read -r smoke_test_exit_code custom_test_exit_code < "$result_file"
          if [[ ! "$smoke_test_exit_code" =~ ^[0-9]+$ || ! "$custom_test_exit_code" =~ ^[0-9]+$ ]]; then
            echo "Invalid smoke-test exit codes: $smoke_test_exit_code $custom_test_exit_code" >&2
            exit 1
          fi
          if [[ "$smoke_test_exit_code" -ne 0 || "$custom_test_exit_code" -ne 0 ]]; then
            echo "Smoke tests failed (tmux.repl: $smoke_test_exit_code; custom REPL: $custom_test_exit_code)." >&2
            exit 1
          fi

          report_dir="${XDG_STATE_HOME:-$HOME/.local/state}/tmux.repl/smoke-tests"
          mapfile -t report_paths < <(find "$report_dir" -maxdepth 1 -type f -name 'smoke-test-*.json' -print | sort)
          if [ "${#report_paths[@]}" -lt 2 ]; then
            echo "Expected both smoke-test JSON reports in $report_dir." >&2
            printf 'Found: %s\n' "${report_paths[@]}"
            exit 1
          fi

          ruby -rjson -e '
            ARGV.each do |path|
              report = JSON.parse(File.read(path))
              abort "Unsupported report schema in #{path}." unless report.fetch("schema_version") == 1
              abort "Smoke test report is not successful: #{path}." unless report.fetch("status") == "passed"
              abort "Smoke test report exit code is not zero: #{path}." unless report.fetch("exit_code") == 0
              checks = report.fetch("checks")
              failed = checks.reject { |check| check.fetch("status") == "passed" }
              abort "Failed checks in #{path}: #{failed.map { |check| check.fetch("name") }.join(", ")}" unless failed.empty?
              puts "Validated #{checks.length} checks from #{path}."
            end
          ' "${report_paths[@]}"

          exit 0
      - name: Prepare smoke-test report artifact
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/tmux-repl-smoke-tests"
          report_dir="${XDG_STATE_HOME:-$HOME/.local/state}/tmux.repl/smoke-tests"
          if [ -d "$report_dir" ]; then
            cp -a "$report_dir/." "$RUNNER_TEMP/tmux-repl-smoke-tests/"
          fi
      - name: Upload tmux.repl smoke-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmux-repl-smoke-test-report
          path: ${{ runner.temp }}/tmux-repl-smoke-tests/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Show LavinMQ logs on failure
        if: failure()
        run: |
          if docker container inspect lavinmq >/dev/null 2>&1; then
            docker logs lavinmq || echo "Warning: could not retrieve LavinMQ logs." >&2
          else
            echo "LavinMQ container was not created; skipping log collection."
          fi
      - name: Stop LavinMQ
        if: always()
        run: docker rm --force lavinmq >/dev/null 2>&1 || true
